name: Preuve Lean et tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les sources du projet
        run: |
          if grep -nwE 'sorry|admit|native_decide' Probatio.lean Axiomes.lean Probatio/*.lean; then
            exit 1
          fi

      - name: Compiler avec la version du fichier lean-toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          use-github-cache: 'false'

      - name: Vérifier les deux listes d'axiomes
        run: |
          set -euo pipefail
          lean --version
          lake env lean Axiomes.lean | tee axiomes.txt
          python3 scripts/verifier_axiomes.py axiomes.txt

      - name: Conserver les axiomes du commit testé
        uses: actions/upload-artifact@v4
        with:
          name: axiomes-${{ github.sha }}
          path: axiomes.txt
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Tests du vérificateur en flux
        working-directory: python
        run: python -B -m unittest -v test_flux
